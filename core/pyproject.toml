[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bus2gosettings"
version = "0.1.1-alpha"
dependencies = [
	"pydantic>=2.13.5",
	"pydantic_settings>=2.15.0"
]

[tool.setuptools.package-data]
"*" = ["*.toml"]

[tool.setuptools.packages.find]
where = ["src"]
